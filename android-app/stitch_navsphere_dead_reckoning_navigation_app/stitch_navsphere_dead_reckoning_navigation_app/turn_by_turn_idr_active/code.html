<script>
  // Dynamic Realtime Timer Simulation for Tunnel Outage Duration
  let seconds = 42;
  const timerElement = document.getElementById('idrTimer');
  
  if (timerElement) {
    setInterval(() => {
      seconds++;
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      timerElement.textContent = 
        (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
    }, 1000);
  }

  // Toggle sensor telemetry details
  function toggleDiagnosticsModal() {
    const drawer = document.getElementById('diagnosticsDrawer');
    if (drawer) {
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        drawer.classList.add('flex');
      } else {
        drawer.classList.add('hidden');
        drawer.classList.remove('flex');
      }
    }
  }
</script></main>
